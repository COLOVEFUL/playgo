[project]
name = "playgo-backend"
version = "0.1.0"
description = "弈 · PlayGo —— 本地围棋对弈（KataGo AI / 复盘 / 形势判断）后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["uv_build>=0.7,<1"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "playgo"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "ty>=0.0.1a5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",       # 文档字符串风格不强制
    "COM812",  # 与 ruff format 冲突
    "ISC001",  # 同上
    "T201",    # 允许 print（本地工具）
    "S101",    # 测试中允许 assert
    "PLR2004", # 测试中的魔法数字
    "RUF001",  # 全角标点是本项目的正文（中文 UI）
    "RUF002",
    "RUF003",
    "CPY001",  # 不要求版权头
    "ANN",     # 注解逐步补
    "N818",    # IllegalMove 域内惯用名
    "FBT001",  # 布尔位参在内部 API 可接受
    "FBT002",
    "DTZ005",  # 本地应用用本地时间即可
    "TRY300",  # try/else 风格不强求
    "S112",    # 损坏谱跳过属正常
    "ASYNC109",  # timeout 参数名与 asyncio 习惯一致
    "PLR0911", # 状态机分支多属正常
    "PLR0913", # 内部 API 参数数放宽
    "ERA001",  # 保留少量被注释的说明代码
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S311", "ARG001", "SLF001", "INP001", "C901", "PLR0912"]
"src/playgo/downloader.py" = ["S310"]   # URL 均为硬编码官方源
"src/playgo/katago.py" = ["S311"]       # 游戏采样用伪随机即可
"src/playgo/main.py" = ["SLF001", "RUF006", "DTZ005", "TRY401", "TRY300", "S112", "ASYNC109", "PLR0911", "PLR0913"]

[tool.ty.environment]
python-version = "3.11"
